---
Name: userdocs-config
---
SilverStripe\Core\Injector\Injector:
  Psr\SimpleCache\CacheInterface.userdocsmanifest:
    factory: 'SilverStripe\Core\Cache\CacheFactory'
    constructor:
      namespace: 'userdocsmanifest'
  # Commonmark markdown converter injection config
  League\CommonMark\Environment\EnvironmentBuilderInterface.userdocs:
    class: 'League\CommonMark\Environment\Environment'
    constructor:
      config:
        alert:
          icons:
            active: true
    calls:
      CommonMarkCoreExtension: ['addExtension', ['%$League\CommonMark\Extension\CommonMark\CommonMarkCoreExtension']]
      FrontMatterExtension: ['addExtension', ['%$League\CommonMark\Extension\FrontMatter\FrontMatterExtension']]
      GithubFlavoredMarkdownExtension: ['addExtension', ['%$League\CommonMark\Extension\GithubFlavoredMarkdownExtension']]
      HeadingPermalinkExtension: ['addExtension', ['%$League\CommonMark\Extension\HeadingPermalink\HeadingPermalinkExtension']]
      TableOfContentsExtension: ['addExtension', ['%$League\CommonMark\Extension\TableOfContents\TableOfContentsExtension']]
      AlertExtension: ['addExtension', ['%$PomoDocs\CommonMark\Alert\AlertExtension']]
  League\CommonMark\MarkdownConverter.userdocs:
    class: 'League\CommonMark\MarkdownConverter'
    constructor:
      environment: '%$League\CommonMark\Environment\EnvironmentBuilderInterface.userdocs'
